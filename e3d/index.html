<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>El 1% · 3D</title><style>
@font-face{font-family:An;src:url(font/Anton.ttf)}@font-face{font-family:PS;src:url(font/PS.ttf);font-weight:100 900}
html,body{margin:0;height:100%;overflow:hidden;background:#070204;font-family:PS,system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
#c3d{position:absolute;inset:0}
#hud{position:absolute;inset:0;pointer-events:none}
#nivel{position:absolute;left:2.2vmin;top:2vmin;font:clamp(28px,7vmin,64px) An;color:#ffd77a;background:radial-gradient(#3a0c06,#140304);border:3px solid #e8a73a;border-radius:50%;width:16vmin;height:16vmin;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 6px #000;box-shadow:0 0 22px #ff7a2a88}
#nivel:empty{display:none}#nivel small{font-size:.5em}
#bote{position:absolute;right:2.2vmin;top:2vmin;font:clamp(18px,4.6vmin,40px) An;color:#fff;background:linear-gradient(#5a1206,#230404);border:2px solid #e8a73a;border-radius:12px;padding:.2em .7em;letter-spacing:1px}
#quedan{position:absolute;right:2.2vmin;top:calc(2vmin + clamp(30px,7vmin,62px));font:700 clamp(12px,2.6vmin,20px) PS;color:#ffd9a0;text-align:right}
#sub{position:absolute;left:50%;bottom:3vmin;transform:translate(-50%,140%);max-width:min(92vw,900px);background:linear-gradient(#2a0804ee,#120202ee);border:2px solid #e8a73a;border-radius:14px;padding:.6em 1.1em;font:600 clamp(14px,3.2vmin,24px) PS;transition:transform .35s;text-align:center}
#sub.on{transform:translate(-50%,0)}#sub b{display:block;font:clamp(11px,2.2vmin,16px) An;color:#ffb347;letter-spacing:1px;margin-bottom:.15em}
.preg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;width:min(94vw,1100px);max-height:94vh;overflow:auto;transition:.3s;background:linear-gradient(#1d0604f2,#0c0202f2);border:3px solid #e8a73a;border-radius:20px;box-shadow:0 0 40px #ff6a1a66;padding:1.6vmin 2vmin;box-sizing:border-box}
.preg.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.ptop{display:flex;align-items:center;gap:1.6vmin}.ppct{font:clamp(26px,6vmin,54px) An;color:#ffd77a;min-width:2.4em;text-align:center}.ppct small{font-size:.5em}
.pcab{flex:1;font:700 clamp(15px,3.4vmin,28px) PS;line-height:1.2}
.ptim{position:relative;width:clamp(44px,9vmin,72px);height:clamp(44px,9vmin,72px);flex:none}.ptim svg{width:100%;height:100%;transform:rotate(-90deg)}.ptim circle{fill:none;stroke:#3a1a10;stroke-width:4}.ptim .arc{stroke:#ffb347}.ptim.poco .arc{stroke:#ff3a20}
.ptim b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:clamp(16px,3.6vmin,28px) An}
.pctx{display:flex;gap:2vmin;align-items:center;justify-content:center;margin:1.4vmin 0;flex-wrap:wrap}.pctx img{max-height:38vh;max-width:100%;border-radius:12px;border:2px solid #e8a73a88;background:#fff}
.pbody{font:600 clamp(14px,3vmin,24px) PS;text-align:center;white-space:pre-line;max-width:60em}.pbody.izq{text-align:left}
.pinp{display:flex;flex-wrap:wrap;gap:1.2vmin;justify-content:center;margin:1vmin 0}
.popt{flex:1 1 40%;min-width:30%;display:flex;align-items:center;gap:.6em;background:linear-gradient(#3a1006,#1a0503);color:#fff;border:2px solid #b8742a;border-radius:999px;padding:.55em 1em;font:700 clamp(14px,3vmin,22px) PS;cursor:pointer;text-align:left}
.popt i{font:clamp(14px,3vmin,22px) An;color:#ffd77a;font-style:normal}.popt img{height:9vmin;border-radius:8px;background:#fff}.popt.conimg{flex-direction:column;flex:1 1 20%;border-radius:16px}.popt.conimg img{height:auto;max-height:24vh;max-width:100%}.popt.sel{border-color:#ffd77a;background:linear-gradient(#a8460c,#5a1a04)}.popt.bien{background:linear-gradient(#2fa84a,#0d5a1c)!important;border-color:#9effa8}.popt.mal{background:linear-gradient(#c0281a,#5a0a04)!important}
.popt em{font-style:normal;color:#ffd77a}
.ptxt{flex:1 1 100%;font:700 clamp(16px,3.6vmin,28px) PS;padding:.45em .8em;border-radius:12px;border:2px solid #e8a73a;background:#0a0202;color:#fff;text-align:center;box-sizing:border-box;max-width:700px}
.pnum{display:grid;grid-template-columns:repeat(6,1fr);gap:.8vmin;width:min(90%,520px)}.pnum button,.pchips button{font:700 clamp(16px,3.4vmin,26px) PS;padding:.35em;border-radius:10px;border:2px solid #b8742a;background:#2a0a04;color:#fff}
.pchips{display:flex;flex-wrap:wrap;gap:.8vmin;justify-content:center;width:100%}.pchips button{font-size:clamp(13px,2.6vmin,20px)}
.pbar{display:flex;gap:1.4vmin;justify-content:center;margin-top:1vmin;flex-wrap:wrap}
.pbtn{font:clamp(15px,3.2vmin,26px) An;letter-spacing:1px;padding:.4em 1.4em;border-radius:999px;border:2px solid #e8a73a;background:linear-gradient(#5a1206,#2a0504);color:#fff;cursor:pointer;pointer-events:auto}.pbtn.ok{background:linear-gradient(#ffcf6a,#d07a12);color:#2a0802}.pbtn:disabled{opacity:.45}.pbtn.pase{border-color:#7ad0ff}
.psol{margin-top:1.2vmin;padding:1vmin 1.6vmin;border-radius:14px;font:600 clamp(13px,2.8vmin,22px) PS;text-align:center}.psol.si{background:#0d4a1c}.psol.no{background:#5a0a04}.psol b{font:clamp(18px,4vmin,32px) An;letter-spacing:1px}.psol u{text-decoration:none;color:#ffd77a;font-weight:800}.psol img{max-height:26vh;border-radius:10px;margin-top:.6em;background:#fff}
.pdec{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;width:min(90vw,640px);background:linear-gradient(#2a0804f4,#100202f4);border:3px solid #e8a73a;border-radius:20px;padding:2.4vmin;text-align:center;box-shadow:0 0 40px #ff6a1a88}
.pdec h3{margin:0 0 .3em;font:clamp(22px,5vmin,40px) An;color:#ffd77a;letter-spacing:1px}.pdec p{font:600 clamp(14px,3vmin,22px) PS}
#start,#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;background:radial-gradient(#3a0c06cc,#070204ee);z-index:8;font:clamp(16px,3.4vmin,26px) An;letter-spacing:1px}
#start img{width:min(60vw,52vh)}#start b{pointer-events:auto}
</style></head><body><div id="c3d"></div>
<div id="hud"><div id="nivel"></div><div id="bote"></div><div id="quedan"></div><div id="sub"></div></div><div id="preg" class="preg"></div>
<div id="start"><img src="../logo.png" alt="EL 1%"><b class="pbtn ok">Toca para empezar</b></div><div id="loading">Cargando el plató…</div>
<script src="../mc3d/mc3d.js"></script><script src="e3d.js"></script></body></html>
